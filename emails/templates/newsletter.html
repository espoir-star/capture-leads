<!DOCTYPE html>
<!--
  TEMPLATE NEWSLETTER ALTHOCE — rempli par scripts/newsletter/campaign.ts
  Marqueurs %%…%% remplacés à la génération. Balises {{ … }} = Brevo
  (lien miroir, désinscription), laissées intactes.
  Tables + CSS inline : Gmail, Outlook (desktop/web), Apple Mail, mobile.
-->
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="x-apple-disable-message-reformatting" />
  <meta name="color-scheme" content="light" />
  <meta name="supported-color-schemes" content="light" />
  <title>%%TITLE%%</title>
  <style>
    @media only screen and (max-width: 620px) {
      .container { width: 100% !important; }
      .px { padding-left: 22px !important; padding-right: 22px !important; }
      .h1 { font-size: 24px !important; line-height: 31px !important; }
    }
    a { color: #157A5B; }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#F3F4F2;-webkit-text-size-adjust:100%;">
  <!-- Texte d'aperçu (preheader), invisible dans le corps -->
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:#F3F4F2;">%%PREVIEW_TEXT%%&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F3F4F2;">
    <tr>
      <td align="center" style="padding:28px 12px;">
        <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;">

          <!-- Lien miroir -->
          <tr>
            <td align="right" style="padding:0 4px 10px;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#7A7F7A;">
              <a href="{{ mirror }}" style="color:#7A7F7A;text-decoration:underline;">Voir dans le navigateur</a>
            </td>
          </tr>

          <tr>
            <td style="background-color:#FFFFFF;border:1px solid #E3E6E2;border-radius:12px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">

                <!-- ALTHOCE -->
                <tr>
                  <td class="px" style="padding:28px 40px 0;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:bold;color:#0A0A0A;letter-spacing:-0.3px;">
                    Althoce<span style="color:#1D9E75;">.</span>
                  </td>
                </tr>

                <!-- Hook / titre -->
                <tr>
                  <td class="px" style="padding:22px 40px 0;">
                    <h1 class="h1" style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:27px;line-height:35px;font-weight:bold;color:#0A0A0A;">%%TITLE%%</h1>
                  </td>
                </tr>

                <!-- Introduction + contenu principal + cas d'usage + insight (Markdown) -->
                <tr>
                  <td class="px" style="padding:6px 40px 0;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:26px;color:#2B2F2B;">
                    %%CONTENT%%
                  </td>
                </tr>

                <!-- CTA -->
                %%CTA%%

                <!-- Signature -->
                <tr>
                  <td class="px" style="padding:26px 40px 32px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:23px;color:#2B2F2B;">
                    %%SIGNATURE%%
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer Brevo -->
          <tr>
            <td style="padding:18px 16px 8px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#7A7F7A;text-align:center;">
              Althoce — Agence d'automatisation IA, Bordeaux.<br />
              Actualités et conseils IA Althoce en lien avec votre activité professionnelle.<br />
              <a href="{{ unsubscribe }}" style="color:#7A7F7A;text-decoration:underline;">Se désinscrire en 1 clic</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
